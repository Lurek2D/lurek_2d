# Use first when the task is broad, ambiguous, or crosses many folders.
# Typical work: scope definition, routing to the right skill or agent, sequencing, dependency planning, handoff structure.
# Best fit skills: route-prompt and task decomposition work before handoff to a narrower role.
# Preferred tools: read-only shell, repo MCP, config/docs inspection.
# Do not use as the default implementation profile; after scoping, hand execution to a narrower role.
name = "manager"
description = "Planning manager for task scoping, execution sequencing, role selection, and cross-domain orchestration."
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "read-only"
personality = "pragmatic"
service_tier = "default"
web_search = "cached"
