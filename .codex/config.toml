# Repo-wide defaults for Codex in this workspace.
# Keep these generic. Narrow role behavior should live in per-agent TOML files.
# model_reasoning_effort = "medium"
approval_policy = "on-failure"
sandbox_mode = "danger-full-access"
personality = "pragmatic"
web_search = "cached"

[features]
fast_mode = false
hooks = false
memories = false
multi_agent = false
personality = true
shell_snapshot = false
shell_tool = true
undo = true
child_agents_md = false

[mcp_servers.lurek_tools]
command = "C:\\WINDOWS\\System32\\cmd.exe"
args = ["/c", "tools\\python.cmd", "tools\\mcp\\lurek_mcp_server.py"]
cwd = "."
startup_timeout_sec = 120

[mcp_servers.lurek_tools.env]
PYTHONUTF8 = "1"

# Agent registry.
# Rule of thumb for users:
# - choose the narrowest agent that owns the target folder and artifact type
# - do not use manager as a default coder; use it to scope, split, or route work
# - skills and tools are not hard-bound per role in this TOML layer; use comments below as intended operating guidance

# Subagent guardrails.
# Keep nesting shallow so specialized roles stay explicit and predictable.
[agents]
max_depth = 1
max_threads = 4
job_max_runtime_seconds = 1800

# Engine internals in Rust: runtime systems, rendering, audio, physics, shader plumbing.
[agents.developer]
description = "Rust engine implementer for src/ internals and engine-side feature delivery."
config_file = "agents/developer.toml"
nickname_candidates = ["engine", "runtime", "rust-dev"]

# Rust<->Lua API surface: wrappers, parity, ergonomics, thin bindings, public scripting surface.
[agents.lua_designer]
description = "Lua API designer for src/lua_api/ bindings, wrapper thinness, and public scripting ergonomics."
config_file = "agents/lua_designer.toml"
nickname_candidates = ["lua-api", "binding", "surface"]

# Test-only work: unit, integration, stress, evidence, harnesses, regression reproduction.
[agents.tester]
description = "Test engineer for tests/, coverage closure, regression repros, and validation artifacts."
config_file = "agents/tester.toml"
nickname_candidates = ["tests", "coverage", "regression"]

# Read-only audit and verdicts. Prefer this role for reviews, risk scans, and performance checks.
[agents.reviewer]
description = "Read-only verifier for repo-wide reviews, audits, performance checks, and quality opinions."
config_file = "agents/reviewer.toml"
nickname_candidates = ["review", "audit", "verifier"]

# Architectural contracts and subsystem boundaries, not day-to-day feature coding.
[agents.architect]
description = "Architecture steward for docs/architecture/, module boundaries, and system-level design contracts."
config_file = "agents/architect.toml"
nickname_candidates = ["architecture", "boundaries", "design"]

# Docs and generated docs surfaces: specs, docstrings, pages, snippets, API-facing written material.
[agents.doc_writer]
description = "Documentation writer for docs/, the sibling lurek_2D_pages repo, specs, docstrings, snippets, and generated docs content."
config_file = "agents/doc_writer.toml"
nickname_candidates = ["docs", "specs", "writer"]

# Lua-side content and playable artifacts, not engine internals.
[agents.content]
description = "Content maker for content/ and library/ gameplay scripts, demos, examples, and layouts."
config_file = "agents/content.toml"
nickname_candidates = ["content", "gameplay", "examples"]

# VS Code extension and editor workflow only.
[agents.extension]
description = "Extension engineer for the sibling lurek_2D_extension repo, editor UX, snippets integration, and VS Code workflows."
config_file = "agents/extension.toml"
nickname_candidates = ["vscode", "extension", "editor"]

# Build, tooling, packaging, CI, scripts, and repository automation.
[agents.builder]
description = "Build engineer for tools/, CI, packaging, automation, and developer-facing CLI scripts."
config_file = "agents/builder.toml"
nickname_candidates = ["build", "tools", "ci"]

# Codex-local configuration and retrieval layer, not product code.
[agents.cag_architect]
description = "CAG architect for .codex/, agent and skill definitions, prompts, RAG inputs, and retrieval tuning."
config_file = "agents/cag_architect.toml"
nickname_candidates = ["cag", "rag", "codex-layer"]

# Planning, decomposition, routing, and cross-role coordination.
[agents.manager]
description = "Planning manager for task scoping, execution sequencing, role selection, and cross-domain orchestration."
config_file = "agents/manager.toml"
nickname_candidates = ["planner", "router", "manager"]
