# Backpack modules add passive bonuses or utility effects to a chassis.
kind = "content"

# Jetpack: improves speed, turning, and jump height for mobile scouting.

[[backpack]]
id="ablative_shell"
name="Ablative Shell"
description = "Top-down pixel-art backpack on a transparent background: layered charcoal armor plates with chipped orange heat scars, two dark mounting rails, and a small red service lamp; broad slabs create a rugged sacrificial shell silhouette."
size=5
health_bonus=75
damage_reduction=0.08
color=[0.55,0.40,0.22,1]
cost=23

# Nanorepair pack: adds health and accelerates health regeneration.

