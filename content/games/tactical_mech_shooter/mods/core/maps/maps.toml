# Scenario catalog for the PNG maps. Geometry and terrain stay in the image;
# these entries describe the match rules that consume each image.
kind = "maps"

# Four teams fight independently on the original four-corner arena.
[[map]]
id = "arena_01"
name = "Fourfold Frontier"
image = "mods/core/maps/arena_01.png"
mode = "free_for_all"
team_count = 4
description = "Four-team elimination across a symmetric frontier."
objective_kind = "elimination"

# Teams 1+2 and 3+4 form two balanced alliances.
[[map]]
id = "twin_bastion"
name = "Twin Bastion"
image = "mods/core/maps/twin_bastion.png"
mode = "balanced_2v2"
team_count = 4
alliances = [["team1", "team2"], ["team3", "team4"]]
description = "Two allied pairs contest mirrored bastions."
objective_kind = "elimination"

# Four independent teams share a central crossfire zone.
[[map]]
id = "crossfire_quads"
name = "Crossfire Quads"
image = "mods/core/maps/crossfire_quads.png"
mode = "free_for_all"
team_count = 4
description = "All four teams are hostile; the centre is the prize."
objective_kind = "elimination"

# The lower team must break through to the northern base.
[[map]]
id = "assault_northline"
name = "Northline Assault"
image = "mods/core/maps/assault_northline.png"
mode = "assault"
team_count = 2
description = "Two teams fight through layered northern base defenses."
objective_kind = "destroy_base"
objective_target_team = 2
objective_base_health = 2400

# A horizontal reactor complex creates a second two-team assault route.
[[map]]
id = "assault_reactor"
name = "Reactor Breach"
image = "mods/core/maps/assault_reactor.png"
mode = "assault"
team_count = 2
description = "Attack or hold the reactor corridors and its base."
objective_kind = "destroy_base"
objective_target_team = 2
objective_base_health = 2800

# Three teams converge on one neutral flag in the rift centre.
[[map]]
id = "tri_flag_rift"
name = "Tri-Flag Rift"
image = "mods/core/maps/tri_flag_rift.png"
mode = "capture_the_flag"
team_count = 3
description = "Three-way capture-the-flag battle around a neutral centre flag."
objective_kind = "capture_flag"
objective_capture_limit = 3
