# Registry schema for data records supplied by the core mod.
kind = "schema"

# A race declares the flags shared by its chassis and compatible equipment.
[types.race]
required = ["id", "name", "description", "flags"]
allowUnknown = true

# A corpus is a playable mech chassis with movement, health, energy, and sight stats.
[types.corpus]
required = ["id", "name", "description", "cargo", "health", "energy", "move_speed", "rotation_speed", "radius"]
allowUnknown = true

# A weapon is an equipped left- or right-hand tool, weapon, support beam, or deployable.
[types.weapon]
required = ["id", "name", "description", "kind", "size", "damage", "range", "reload", "energy", "velocity", "accuracy"]
allowUnknown = true

# A backpack is a passive module that modifies a chassis or adds a utility capability.
[types.backpack]
required = ["id", "name", "description", "size"]
allowUnknown = true

# A raster combat effect used by projectiles, explosions, smoke, and fields.
[types.effect]
required = ["id", "name", "sprite"]
allowUnknown = true

# A preset is a ready-to-deploy loadout linking one chassis, two weapons, and one backpack.
[types.preset]
required = ["id", "name", "corpus", "left", "right", "backpack"]
allowUnknown = true
