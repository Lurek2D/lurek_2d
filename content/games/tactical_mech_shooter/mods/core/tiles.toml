# Tile definitions used by the authored arena and the shared tilefield.
kind = "content"

# Open neutral ground with normal movement.
[[tile]]
id="floor"
profile="empty"
color=[0.22,0.28,0.36,1]
move_multiplier=1.0

# Open vegetation ground with normal movement.
[[tile]]
id="grass"
profile="empty"
color=[0.22,0.58,0.18,1]
move_multiplier=1.0

# Open sandy ground that slows movement slightly.
[[tile]]
id="sand"
profile="empty"
color=[0.82,0.66,0.22,1]
move_multiplier=0.86

# Water terrain that strongly slows movement.
[[tile]]
id="water"
profile="empty"
color=[0.10,0.34,0.82,1]
move_multiplier=0.58

# Solid wall that blocks movement, vision, actions, and light.
[[tile]]
id="wall"
profile="wall"
color=[0.45,0.50,0.58,1]
blocks_move=true
blocks_vision=true
blocks_action=true
blocks_light=true

# Window that blocks movement and actions but permits vision and light.
[[tile]]
id="window"
profile="window"
color=[0.18,0.40,0.54,1]
blocks_move=true
blocks_action=true
blocks_vision=false
blocks_light=false

# Closed door that behaves as a fully blocking barrier.
[[tile]]
id="door_closed"
profile="door_closed"
color=[0.48,0.26,0.18,1]
blocks_move=true
blocks_vision=true
blocks_action=true
blocks_light=true

# Open door that restores passage through the doorway.
[[tile]]
id="door_open"
profile="door_open"
color=[0.22,0.42,0.25,1]

# Low cover that blocks movement and actions while allowing partial vision and light.
[[tile]]
id="half_wall"
profile="half_wall"
color=[0.45,0.40,0.28,1]
blocks_move=true
blocks_action=true
blocks_vision=false
light_transmission=0.55

# Smoke cloud that obscures vision and heavily attenuates light.
[[tile]]
id="smoke"
profile="empty"
color=[0.42,0.44,0.48,0.65]
blocks_vision=true
light_transmission=0.20

# Fire hazard/light source that adds strong local illumination.
[[tile]]
id="fire"
profile="empty"
color=[1,0.26,0.05,0.75]
light_intensity=0.9
