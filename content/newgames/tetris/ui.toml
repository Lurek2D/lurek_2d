  color = [1, 1, 1, 1]
  x = 584
  y = 70

  [[widget.children.children]]
  type = "label"
  text = "LEVEL"
  font_size = 24
  color = [0.7, 0.7, 0.9, 1]
  x = 584
  y = 110

  [[widget.children.children]]
  type = "label"
  id = "level_label"
  text = "1"
  font_size = 30
  color = [1, 1, 1, 1]
  x = 584
  y = 130

  [[widget.children.children]]
  type = "label"
  text = "LINES"
  font_size = 24
  color = [0.7, 0.7, 0.9, 1]
  x = 584
  y = 170

  [[widget.children.children]]
  type = "label"
