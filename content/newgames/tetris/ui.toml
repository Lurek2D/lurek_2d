[[widget]]
type = "panel"
id = "root_ui"
w = 800
h = 600
bg_color = [0, 0, 0, 0]

[[widget.children]]
type = "panel"
id = "title_screen"
anchor = "center"
w = 800
h = 600
visible = false
bg_color = [0, 0, 0, 0.72]

  [[widget.children.children]]
  type = "label"
  text = "FALLING BLOCKS"
  font_size = 30
  color = [0.0, 0.9, 0.9, 1]
  anchor = "center"
  y = -120

  [[widget.children.children]]
  type = "label"
  text = "Rotate and stack falling blocks"
  font_size = 24
  color = [0.7, 0.7, 0.9, 1]
  anchor = "center"
  y = -60

  [[widget.children.children]]
  type = "button"
  id = "press_start"
  text = "PRESS ENTER TO START"
  font_size = 30
  color = [1, 1, 1, 1]
  anchor = "center"
  y = 40

  [[widget.children.children]]
  type = "label"
  text = "Left/Right or AD   Move\nUp or W           Rotate\nDown or S         Soft drop\nSpace             Hard drop\nC                 Hold\nEscape            Quit"
  font_size = 20
  color = [0.4, 0.4, 0.5, 1]
  anchor = "center"
  y = 180

[[widget.children]]
type = "panel"
id = "hud"
anchor = "top_left"
w = 800
h = 600
visible = true
bg_color = [0, 0, 0, 0]

  [[widget.children.children]]
