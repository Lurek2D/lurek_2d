[indexing]
max_chunk_size = 1800
min_chunk_size = 120
max_file_bytes = 2000000
allowed_extensions = [".md", ".lua", ".rs", ".py", ".toml", ".json", ".html", ".js", ".ts", ".css", ".wgsl"]
default_target_dirs = ["AGENTS.md", ".codex", "content", "docs", "src", "tests", "tools", "lurek_2d_content", "lurek_2d_extension", "lurek_2d_workbench", "lurek_2d_pages/AGENTS.md"]
ignore_dirs = [".git", ".pytest_cache", "__pycache__", "node_modules", "target", "dist", "build", ".cache", ".vscode-test"]
ignore_files = ["rag_index.db", "rag_index.duckdb", "rag_index.duckdb.wal", "recall_baseline.json"]
ignore_path_patterns = ["tests/artifacts/current/", "tests/artifacts/golden/", "/golden_traces/", "/generated/"]
max_content_chunks_per_file = 160

[search]
# Weights for lexical ranking (path, title, content)
# Favor title matches, but keep content useful for reading-oriented queries.
bm25_weights = [1.0, 8.0, 1.0]
snippet_tokens = 96

[limits]
search_limit = { min = 1, max = 25, default = 8 }
read_neighbors = { min = 0, max = 3, default = 1 }
read_content_chars = { min = 500, max = 100000, default = 12000 }
context_limit = { min = 1, max = 25, default = 8 }
context_neighbors = { min = 0, max = 3, default = 1 }
context_content_chars = { min = 500, max = 100000, default = 8000 }
eval_limit = { min = 3, max = 25, default = 10 }

[watch]
extensions = [".md", ".lua", ".rs", ".py", ".toml", ".html", ".js", ".ts", ".css", ".wgsl", ".json"]
prefixes = ["AGENTS.md", ".codex", "content", "docs", "src", "tests", "tools", "lurek_2d_content", "lurek_2d_extension", "lurek_2d_workbench", "lurek_2d_pages/AGENTS.md"]

[ranking]
generated_path_patterns = ["docs/api/lurek.lua", "docs/api/lurek.md", "docs/specs/manual/", "lurek_2d_pages/"]
vendor_path_patterns = ["node_modules/", "/vendor/"]

[ranking.source_priorities]
api = 8.5
contract = 8.25
skill = 7.25
agent = 6.75
spec = 6.5
source = 5.75
test = 3.5
docs = 4.75
tool = 4.5
example = 3.75
page = 1.0
prompt_mirror = 0.5
default = 1.0
