[indexing]
max_chunk_size = 1800
min_chunk_size = 120
max_file_bytes = 2000000
allowed_extensions = [".md", ".lua", ".rs", ".py", ".toml", ".json", ".html", ".js", ".ts", ".css", ".wgsl"]
default_target_dirs = ["AGENTS.md", ".agents", ".codex", ".github", "content", "docs", "ideas", "library", "src", "tests", "tools"]
ignore_dirs = [".git", ".pytest_cache", "__pycache__", "node_modules", "target", "dist", "build", ".cache"]
ignore_files = ["rag_index.db", "rag_index.duckdb", "rag_index.duckdb.wal", "recall_baseline.json"]
ignore_path_patterns = []

[search]
# Weights for lexical ranking (path, title, content)
# Favor title matches, but keep content useful for reading-oriented queries.
bm25_weights = [1.0, 8.0, 1.0]
snippet_tokens = 96

[ranking]
generated_path_patterns = [".github/prompts/", "docs/api/lurek.lua", "docs/api/lurek.md", "docs/wiki/API-Reference.md"]
vendor_path_patterns = ["node_modules/", "/vendor/"]

[ranking.source_priorities]
api = 8.5
contract = 8.25
skill = 7.25
agent = 6.75
spec = 6.5
source = 5.75
test = 3.5
docs = 4.75
tool = 4.5
example = 3.75
page = 1.0
prompt_mirror = 0.5
default = 1.0
