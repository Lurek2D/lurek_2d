name: Deploy GitHub Pages

on:
  push:
    branches: [root]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs + Material
        run: python -m pip install --disable-pip-version-check "mkdocs==1.6.1" "mkdocs-material==9.6.15"

      - name: Regenerate and check docs
        run: python tools/docs/check_freshness.py

      - name: Check docs quality
        run: python tools/audit/docs_quality.py

      - name: Build MkDocs site
        run: python -m mkdocs build --strict --site-dir _site

      - name: Preserve legacy Lua API redirects
        run: |
          mkdir -p _site/lua-docs
          cp -R pages/lua-docs/. _site/lua-docs/
          if [ -f pages/api/lurek.lua ]; then
            mkdir -p _site/api
            cp pages/api/lurek.lua _site/api/lurek.lua
          fi
          if [ -f pages/api/lureksome.lua ]; then
            mkdir -p _site/api
            cp pages/api/lureksome.lua _site/api/lureksome.lua
          fi
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
