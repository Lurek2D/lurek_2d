name: Deploy GitHub Pages

on:
  push:
    branches: [root]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check generated docs freshness
        run: python tools/docs/check_freshness.py

      - name: Check docs quality
        run: python tools/audit/docs_quality.py

      - name: Install MkDocs + Material
        run: pip install mkdocs mkdocs-material

      - name: Generate Lua API module pages (Markdown)
        run: python tools/docs/gen_module_pages.py

      - name: Build MkDocs site
        run: mkdocs build

      - name: Generate Lua API HTML browser
        run: python tools/docs/gen_docs_lua_html.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

