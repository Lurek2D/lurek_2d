site_name: Lurek2D
site_description: Lua-first 2D runtime and toolkit for games, simulations, visual tools, and interactive desktop apps
site_url: https://lurek2d.github.io/lurek_2d/
repo_url: https://github.com/Lurek2D/lurek_2d
repo_name: Lurek2D/lurek_2d
edit_uri: ""

docs_dir: docs
site_dir: pages
use_directory_urls: false

exclude_docs: |
  specs/
  wiki/
  templates/
  meta/
  snippets.md
  api/rust.md
  CHANGELOG.md
  linux_build.md
  rust-api.md
  howto.md
  AGENTS.md
  architecture/

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/logo.png

extra_css:
  - assets/lurek.css

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lurek2D/lurek_2d

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started.md
    - First Game: first-game.md
    - Project Structure: project-structure.md
  - Lua API:
    - Overview: lua-api.md
    - Full lurek API: api/lurek.md
    - Callbacks: api/callbacks.md
    - Lureksome: api/lureksome.md
  - Module Guides:
    - Overview: module-guides.md
    - Render: modules/render.md
    - Audio: modules/audio.md
    - Input: modules/input.md
    - Physics: modules/physics.md
    - Scene: modules/scene.md
    - Sprite: modules/sprite.md
    - Tilemap: modules/tilemap.md
    - UI: modules/ui.md
    - Save: modules/save.md
    - Procgen: modules/procgen.md
    - AI: modules/ai.md
    - Automation: modules/automation.md
    - Compute: modules/compute.md
    - Pipeline: modules/pipeline.md
    - Dataframe: modules/dataframe.md
    - Province: modules/province.md
    - Graph: modules/flownet.md
    - Pathfind: modules/pathfind.md
    - Network: modules/network.md
  - Examples:
    - Overview: examples.md
    - Reference Games: reference-games.md
    - Recipes: recipes.md
  - Contributors:
    - Overview: contributors.md
